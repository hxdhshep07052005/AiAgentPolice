providers = ["nixpacks"]

[nixpacks]
  # Use Node.js 20
  runtime = "node"
  version = "20"

[phases.setup]
  nix_channel = "stable-24_05"

[phases.install]
  src_dir = "backend"
  cmds = ["npm install"]

[phases.build]
  src_dir = "backend"
  cmds = ["npm run build"]

[start]
  cmd = "node backend/dist/main.js"
